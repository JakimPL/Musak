difficulty:
  max_level: 5
time_signature:
  max_denominator: 16
  relative_numerator_range: 2
harmony:
  enabled: true
  fusion: gated_residual
  plan_encoder_layers: 2
  plan_encoder_heads: 4
  plan_encoder_dropout: 0.10
  gate_init_bias: -1.50
  harmony_adherence_alpha: 1.0
  plan_field_dropout: 0.15
structural:
  shortest_note_duration:
    thresholds: [16, 8, 4, 2]
  max_notes_per_onset:
    thresholds: [1, 2, 3, 4]
  max_notes_per_hand:
    thresholds: [1, 2, 3, 4, 5]
  max_onset_span_semitones:
    thresholds: [4, 7, 12]
  max_melodic_gap_semitones:
    thresholds: [4, 7, 12]
  static_hand_span_degrees:
    thresholds: [3, 5, 7, 14]
  bar_count:
    thresholds: [1, 2, 4, 8, 16, 32]
cfg_dropout_probability: 0.1
