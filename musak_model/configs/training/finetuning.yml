optimization:
  epochs: 5
  batch_size: 16
  learning_rate: 3e-5
  weight_decay: 0.01
event_objective:
  mode: factorized
  kind_weight: 1.0
  duration_weight: 1.0
  degree_weight: 1.0
  accidental_weight: 1.0
  octave_offset_weight: 1.0
  hand_weight: 1.0
musical_auxiliary_targets:
  note_density_bucket_boundaries: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
  rhythmic_diversity_bucket_boundaries: [0.2, 0.4, 0.6, 0.8]
  voice_independence_bucket_boundaries: [0.2, 0.4, 0.6, 0.8]
  hand_span_bucket_boundaries: [3, 5, 8, 12, 16]
musical_auxiliary_objective:
  enabled: true
  weight: 0.1
  bar_weight: 1.0
  note_density_weight: 1.0
  rhythmic_diversity_weight: 1.0
  voice_independence_weight: 1.0
  uses_accidentals_weight: 1.0
  dotted_duration_weight: 1.0
  hand_span_weight: 1.0
harmonic_relation_objective:
  enabled: true
  weight: 0.05
  downbeat_weight: 1.5
  strong_beat_weight: 1.2
  weak_beat_weight: 0.7
  left_hand_weight: 1.2
  right_hand_weight: 1.0
  opening_weight: 1.0
  continuation_weight: 1.0
  cadence_preparation_weight: 1.2
  cadence_weight: 1.5
  use_plan_confidence_weight: true
  minimum_plan_confidence_weight: 0.5
harmonic_plan_reconstruction_objective:
  enabled: true
  weight: 0.02
  harmonic_function_weight: 1.0
  root_degree_weight: 1.0
  quality_weight: 0.5
  extension_weight: 0.25
  cadence_strength_weight: 0.5
harmonic_plan_contrastive_objective:
  enabled: false
  weight: 0.0
  negative_count: 3
  temperature: 0.20
early_stopping:
  enabled: true
  patience_epochs: 10
  min_delta: 0.0
runtime:
  num_workers: 12
  device: cuda
conditioning:
  use_time_signature: true
  use_scale_type: true
  use_difficulty: false
  use_structural_conditioning: true
  use_harmony_conditioning: true
  use_validity_penalty: true
  validity_penalty_weight: 0.02
checkpoints:
  checkpoint_directory: artifacts/checkpoints/finetuning
  resume_checkpoint: null
  save_all_epochs: false
mlflow:
  enable_mlflow: true
  mlflow_experiment_name: musak-finetune
  mlflow_run_name: null
  mlflow_tracking_uri: null
generation_evaluation:
  enabled: true
  every_epochs: 5
  soft_sample_count: 4
  hard_sample_count: 4
  max_new_tokens: 256
  seed: 1729
  temperature: 1.0
  top_k: 32
  scale_root: 0
  scale_type: major
  time_numerator: 4
  time_denominator: 4
  bar_count: 4
  minimum_duration_denominator: 16
  allow_dotted_durations: true
  max_notes_per_hand: 5
  maximum_onset_span_semitones: 12
  maximum_pitch_gap_semitones: 12
  maximum_static_hand_span_degrees: 5
  harmonic_logit_bias_enabled: false
  harmonic_logit_bias_alpha: 0.20
