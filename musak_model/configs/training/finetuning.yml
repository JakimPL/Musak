optimization:
  epochs: 5
  batch_size: 16
  learning_rate: 1e-4
  weight_decay: 0.01
runtime:
  num_workers: 0
  device: cuda
conditioning:
  use_time_signature: true
  use_scale_type: true
  use_difficulty: false
  use_structural_conditioning: true
  use_validity_penalty: true
  validity_penalty_weight: 0.02
checkpoints:
  checkpoint_dir: checkpoints/finetuning
  resume_checkpoint: null
  pretraining_checkpoint: checkpoints/pretraining/best.pt
mlflow:
  enable_mlflow: true
  mlflow_experiment_name: musak-finetune
  mlflow_run_name: null
  mlflow_tracking_uri: null
