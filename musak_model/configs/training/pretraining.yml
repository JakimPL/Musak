optimization:
  epochs: 30
  batch_size: 16
  learning_rate: 3e-4
  weight_decay: 0.01
runtime:
  num_workers: 0
  device: cuda
conditioning:
  use_time_signature: true
  use_scale_type: true
  use_difficulty: false
  use_structural_conditioning: true
  use_validity_penalty: true
  validity_penalty_weight: 0.10
checkpoints:
  checkpoint_dir: checkpoints/pretraining
  resume_checkpoint: null
mlflow:
  enable_mlflow: true
  mlflow_experiment_name: musak-pretrain
  mlflow_run_name: null
  mlflow_tracking_uri: null
