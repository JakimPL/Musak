<!doctype html>

<head>
	<link rel="stylesheet" href="{{ request.url_for('static', path='css/style.css') }}">
	<link rel="stylesheet" href="{{ request.url_for('static', path='css/rhythm.css') }}">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A simple rhythm score generator.">
	<meta name="author" content="Jakim">
	<title>Rhythm generator</title>
</head>

<body>
	<div class="main">
		<p>
		<h1>Rhythm Generator v0.1</h1>

		<p style="text-align: center">Generate a random rhythm score.</p>
	</div>

	<div class="row">
		<div class="column_right">
			<div style="text-align: center">
				<input type="button" id="play" value="Play" class="play">
			</div>

			<div class="table">
				<p id="score"><img src="" alt="" id="rhythm_image"></p>
				<p id="error" style="font-weight: bold"></p>
				<p id="error_message" style="font-style: italic"></p>
				<p id="time_signature_error" style="font-style: italic"></p>
			</div>
		</div>

		<div class="column_left">
		<form method="post" id="settings_form" data-api-url="/api/rhythm/submit"
			data-config-url="/api/rhythm/config">
				<div class="table">
					<div class="table_row" style="text-align: center">
						<input type="submit" id="submit" value="Generate rhythm">
					</div>
					<div id="form_fields"></div>
				</div>
			</form>
		</div>
	</div>

	<script type="module" src="{{ request.url_for('static', path='js/modules/rhythm.js') }}"></script>
</body>
