[project]
name = "musak"
version = "0.2.0"
description = "Musak - Web music training tools"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jakim" }]

dependencies = [
    "abjad",
    "fastapi[standard]",
    "music21",
    "pydantic",
    "audioop-lts",
    "pydub",
    "pyfluidsynth",
    "PyYAML",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "isort",
    "mypy",
    "pre-commit",
    "pylint",
    "pylint-pydantic",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musak"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["musak"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["musak"]
exclude = ["tests"]
explicit_package_bases = true
ignore_missing_imports = true
strict = true

[tool.pylint.main]
py-version = "3.13"
