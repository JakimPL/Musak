[project]
name = "musak"
version = "0.1.0"
description = "Musak - Web music training tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jakim" }]

dependencies = [
    "abjad",
    "fastapi[standard]",
    "music21",
    "pydantic",
    "pydub",
    "pyfluidsynth",
    "PyYAML",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["httpx", "isort", "mypy", "pre-commit", "pylint", "pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "core", "modules", "shared"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["api", "core", "modules", "shared"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["api", "config", "core", "shared"]
explicit_package_bases = true
ignore_missing_imports = true
strict = true

[tool.pylint.main]
py-version = "3.11"
