[project]
name = "musak"
version = "0.2.0"
description = "Musak - Web music training tools"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jakim" }]

dependencies = [
    "fastapi[standard]",
    "mido>=1.3.3",
    "pydantic>=2.11.7",
    "PyYAML>=6.0.3",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "isort",
    "mypy",
    "pre-commit",
    "pylint",
    "pylint-pydantic",
    "pytest",
    "pytest-cov",
]

[dependency-groups]
model = [
    "altair>=6.1.0",
    "marimo>=0.23.8",
    "mlflow>=3.12.0",
    "music21>=10.1.0",
    "numpy>=2.4.6",
    "pandas>=2.3.3",
    "scipy>=1.17.1",
    "torch>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musak", "musak_model", "musak_shared"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["musak", "musak_model"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["musak", "musak_model"]
exclude = ["notebooks", "tests"]
explicit_package_bases = true
ignore_missing_imports = true
strict = true

[tool.pylint.main]
py-version = "3.13"
